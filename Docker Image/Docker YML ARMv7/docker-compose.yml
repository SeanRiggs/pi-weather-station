services:
  weather-station:
    build:
      context: ../..
      args:
        NODE_VERSION: "22"
    image: pi-weather-station:local
    container_name: weather-station
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - weather-data:/data
    restart: unless-stopped
volumes:
  weather-data:
